# Chinese posts currently use both zh and zh-cn. Keep a single searchable index
# so the persistent navigation can find every article from any page.
# https://pagefind.app/docs/config-options/#force-language
force_language: zh
exclude_selectors:
  - "span.katex"
  - "span.katex-display"
  - "[data-pagefind-ignore]"
  - ".search-panel"
  - "#search-panel"
