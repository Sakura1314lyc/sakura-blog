  // 主题系统 - 立即执行以防止 FOUC（无样式内容闪烁）
  // 优先级：1. 用户手动选择 > 2. 系统偏好
  (function() {
    function getTheme() {
      // 用户明确选择了主题
      if (localStorage.theme === 'dark') return 'dark';
      if (localStorage.theme === 'light') return 'light';
      // 未设置，跟随系统偏好
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(theme, target) {
      var root = target || document.documentElement;
      root.classList.toggle('dark', theme === 'dark');
      root.dataset.theme = theme; // For astro-mermaid autoTheme
    }

    // 立即应用主题
    applyTheme(getTheme());

    // 监听系统主题偏好变化
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      // 仅当用户未明确选择主题时自动切换
      if (!('theme' in localStorage)) {
        applyTheme(getTheme());
      }
    });

    // 先写进新页面的 <html>：swap 会清空根元素属性，期间若有样式计算（如恢复持久化元素的焦点）也能拿到正确主题
    document.addEventListener('astro:before-swap', function(event) {
      applyTheme(getTheme(), event.newDocument.documentElement);
    });

    // View Transition 切换页面后重新应用主题（在 DOM 渲染前）
    document.addEventListener('astro:after-swap', function() {
      applyTheme(getTheme());
    });
  })();
