# Sakura · astro-koharu
# 文章保留在 src/content/blog，站点设置统一从这里读取。
site:
  title: 上杉绘梨衣の博客
  alternate: Sakura
  subtitle: 我们都是小怪兽，有一天会被正义的奥特曼杀死
  name: Sakura
  description: Sakura 看番日记 | 算法学习 | 大模型与磕盐。
  avatar: /img/avatar.webp
  showLogo: false
  author: Sakura
  url: https://sakuralyc-blog.vercel.app
  defaultOgImage: /img/avatar.webp
  startYear: 2026
  timezone: Asia/Shanghai
  enableSlugTransliteration: false
  keywords: [Sakura, 博客, 算法, 动态规划, 计算机, 大模型, 学习笔记]

i18n:
  defaultLocale: zh
  locales:
    - code: zh
      label: 中文

categoryMap:
  算法: algorithms
  动态规划: dynamic-programming
  大模型: llm
  计算机学习: computer-science
  日常学习: study
  大学物理1复习: physics
  数学: mathematics

featuredCategories:
  - link: algorithms
    label: 算法
    image: /img/cover/2.webp
    description: 从二分、倍增到数据结构
  - link: dynamic-programming
    label: 动态规划
    image: /img/cover/4.webp
    description: 状态设计与转移的学习记录
  - link: llm
    label: 大模型
    image: /img/cover/1.webp
    description: Agent、上下文工程与后训练
  - link: computer-science
    label: 计算机学习
    image: /img/cover/11.webp
    description: 操作系统、网络与开发工具

featuredSeries: []

social:
