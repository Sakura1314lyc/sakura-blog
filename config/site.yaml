    url: https://github.com/Sakura1314lyc
    icon: ri:github-fill
    color: '#191717'
  bilibili:
    url: https://space.bilibili.com/198170603
    icon: ri:bilibili-fill
    color: '#00A1D6'
  rss:
    url: /rss.xml
    icon: ri:rss-fill
    color: '#F78422'

friends:
  intro:
    title: 友链
    subtitle: 相遇在文字之间
  data: []
announcements: []

content:
  addBlankTarget: true
  smoothScroll: true
  addHeadingLevel: true
  enhanceCodeBlock: true
  enableCodeCopy: true
  enableCodeFullscreen: true
  enableLinkEmbed: true
  enableCodePenEmbed: false
  enableTweetEmbed: false
  enableOGPreview: false
  lazyLoadEmbeds: true
  postCardImagePosition: alternating
  enableShokaContainers: true
  # Shoka 属性语法会把列表公式末尾的 {…} 当成属性；保留原文的 LaTeX 分组。
  enableShokaAttrs: false
  enableShokaEffects: true
  enableShokaSpoiler: true
  enableShokaRuby: true
  enableShokaHexoTags: true
  enableMath: true
  enableCodeMeta: true
  enableQuiz: true
  enableEncryptedBlock: true

motion:
  level: lively
  heroPetals: true
  clickBurst: true

moments:
  enabled: false
editor:
  enabled: true
colophon:
  enabled: false
postActions:
  copyMarkdown: true
  downloadMarkdown: true
  openInEditor: off

navigation:
  - name: 首页
    nameKey: nav.home
    path: /
    icon: ri:home-heart-fill
  - name: 文章
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children:
      - name: 分类
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: 标签
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: 归档
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
  - name: 友链
    nameKey: nav.friends
    path: /friends
    icon: ri:links-line
  - name: 关于
    nameKey: nav.about
    path: /about
    icon: fa6-regular:circle-user
  - name: 歌单
    nameKey: nav.music
    path: /music
    icon: ri:music-2-fill
  - name: 写作室
    path: /editor
    localeIndependent: true
    icon: ri:edit-box-line

comment:
